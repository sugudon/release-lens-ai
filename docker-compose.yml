services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: release-lens-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: release_lens
      POSTGRES_USER: release_lens
      POSTGRES_PASSWORD: release_lens_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: